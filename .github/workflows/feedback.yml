# Feedback from the pages: every 10 minutes, fetch the messages the feedback relay (feedback-relay/Code.gs, a Google
# Apps Script web app shared with the box viewer's pages) has received for this site from the feedback form of the
# pages (docs/feedback.js), and open one issue each.
# Uses GitHub's own token for this run (issues: write); no personal token is stored anywhere. Run it by hand under
# Actions → Run workflow. Adapted from ruedtim/glamhack26-box-viewer.
name: Feedback von den Seiten
on:
  schedule:
    - cron: '6-59/10 * * * *'  # every 10 minutes, off the full hour and off the box viewer's minutes (3, 13 …)
  workflow_dispatch:
permissions:
  issues: write
concurrency:
  group: feedback-relay
  cancel-in-progress: false
jobs:
  issues:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Open an issue for each new message
        uses: actions/github-script@v7
        env:
          RELAY_URL: https://script.google.com/macros/s/AKfycbwq5h4eYLosUKT5GRU-6PGGK5sowW_voGYxxn3DRq9g4Ngua-r4scgbuTz5NuladMGS5g/exec  # web app of feedback-relay/Code.gs
        with:
          script: |
            const relay = process.env.RELAY_URL;
            if (!relay) { core.notice('No feedback relay set (RELAY_URL).'); return; }
            const res = await fetch(relay + '?pending=1&site=similar-search');  // the relay serves several sites
            if (!res.ok) throw new Error(`The relay answered ${res.status}`);
            const { items = [] } = await res.json();
            if (!items.length) { core.info('No new feedback.'); return; }
            // issues already opened for a message (a lost «done» must not give a second issue)
            const since = new Date(Date.now() - 2 * 86400000).toISOString();
            const recent = await github.paginate(github.rest.issues.listForRepo,
              { ...context.repo, labels: 'via form', state: 'all', since, per_page: 100 });
            const seen = new Set(recent.map(i => ((i.body || '').match(/feedback-id: ([0-9a-f]+)/) || [])[1]).filter(Boolean));
            const block = s => {  // plain text: a code block longer than any run of backticks inside
              const runs = String(s).match(/`+/g) || [];
              const fence = '`'.repeat(Math.max(3, 1 + Math.max(0, ...runs.map(r => r.length))));
              return `${fence}text\n${s}\n${fence}`;
            };
            for (const it of items) {
              if (!/^[0-9a-f]{8,32}$/.test(it.id || '')) continue;
              if (!seen.has(it.id)) {
                const title = ('Feedback: ' + [it.where || 'Ähnlichkeitssuche', it.inv && `Inv.-Nr. ${it.inv}`].filter(Boolean).join(' · ')).slice(0, 120);
                const when = new Date(it.t).toISOString().slice(0, 16).replace('T', ' ');
                const body = [`**Worum geht es?** ${it.kind}`, '',
                  '**Was ist aufgefallen, und was wäre richtig?**', '', block(it.details), '',
                  '**Wo (von der Seite ausgefüllt)**', '', block(it.context || '(nichts)'), '',
                  `_Ohne GitHub-Konto über das Feedback-Formular der Seiten gesendet (${when} UTC)._`,
                  `<!-- feedback-id: ${it.id} -->`].join('\n');
                const issue = await github.rest.issues.create({ ...context.repo, title, body, labels: ['feedback', 'via form'] });
                core.info(`Opened #${issue.data.number} for message ${it.id}`);
              }
              await fetch(`${relay}?done=${it.id}`);
            }
